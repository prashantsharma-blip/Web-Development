<html>
<head>
<title>Registration Form</title>
</head>
<body>	
<center><h1>Registration Form</h1></center>
<form>
        <fieldset>
            <legend>Personal Details</legend>

<label> Name: </lable>
<input type="Text" name="Name" placeholder="Enter name" required><br>
<br>
<label> Email: </lable>
<input type="Text" name="Email" placeholder="Enter email" required><br>
<br>
<lable> Password: </lable>
<input type="password" name="password" placeholder="Enter password" required><br>
<br>
<lable>Re-Password: </lable>
<input type="re-password" name="re-password" placeholder="Enter re-password" required><br>
<br>
 <label>Gender:</label>
  <input type="radio" name="gender" value="male"> Male
  <input type="radio" name="gender" value="female"> Female
  <input type="radio" name="gender" value="others"> Others
        <br><br>

 <label>Course:</label>
        <select name="course" placeholder="Select your course" required>
            <option value="mca">MCA</option>
            <option value="bca">BCA</option>
            <option value="mba">MBA</option>
            <option value="ballb">BALLB</option>
            <option value="btech">B.Tech</option>

        </select>
        <br><br>
 Date of Birth:
            <input type="date" name="dob"><br><br>

            <input type="submit" value="Register">&nbsp
           &nbsp <input type="reset" value="Reset">

        </fieldset>
    </form>
</body>
</html>
